  deviations:
    - JSON interpretation editor retained as a VS1 usability limitation
    - Hosted accounting tested with synthetic versioned prices, without billed hosted calls
    - Windows/Python 3.12 verified; other execution contexts not claimed
    - Main workspace Ruff crash retained; exact merged source passed in a clean checkout
    - No decision-bearing empirical study was warranted by prescribed implementation checks
  architecture_observations:
    - SQLite WAL and short atomic transitions suffice for the tested single-user/worker scope
    - Domain/application remain independent of FastAPI, concrete storage and MAF types
    - Parquet/filesystem retain large bodies; SQLite retains metadata and events
    - Diagnostics are regenerable projections, not competing authoritative histories
  research_observations:
    - Matching source quotes do not establish interpretation correctness
    - Inspected model output included unsupported extrapolation; no comparative inference
    - Automated integration decisions must not become research labels
  performance_observations:
    - Live token/timing measurements retained in external evidence as incidental observations
    - No benchmark, multi-user scale claim or formal DER overhead comparison conducted
  framework_observations:
    - MAF core 1.19.0 executed real preparation, inference and validation workflows
    - Failure-exception copying friction mitigated by plain failure data
    - Provider failure, semantic failure and framework outcome remain distinguishable
    - No repeated unresolved material friction warrants removing MAF
  technical_debt:
    - Structured JSON editor and shifting pending offset pages
    - Fixed runtime catalogue paths need a deliberate relocation migration
    - Explicit DER re-indexing; no automatic evidence-status subscription
    - Known dependency deprecation warnings, without suppressions
    - Independent reproduction and additional-platform checks not performed
  decisions:
    - Retain the prescribed local architecture and MAF adapter
    - Use OS process ownership rather than heartbeat expiry for recovery
    - Keep terminal VS1 result decisions immutable when adding VS2 richer interaction
    - Keep comparative discovery-method selection behind prospective EDR registration
  decision_trace:
    - old_assumption: independent progress queries describe one state
      evidence: fresh-context review identified mixed-denominator interleaving
      decision: use one read snapshot with a controlled concurrent-write regression
      affected_slices: [VS1, VS2]
    - old_assumption: diagnostic export failures can propagate normally
      evidence: a queue transition may already be committed
      decision: warn on automatic diagnostic export and keep explicit inspection strict
      affected_slices: [VS1, VS2, VS4]
    - old_assumption: documented future routing paths are sufficient
      evidence: backlog explicitly requires reserved continuity schemas
      decision: add strict records without switching behaviour
      affected_slices: [VS1, VS2, VS4]
