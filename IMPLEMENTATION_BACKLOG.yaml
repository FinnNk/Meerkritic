slice_review_required: true
review_fields:
- delivered
- deviations
- architecture_observations
- research_observations
- performance_observations
- framework_observations
- technical_debt
- decisions
- changes_to_remaining_slices
baseline_quality_gates:
  ruff:
    purpose: Python formatting, linting, imports and code conventions
    required_commands:
    - ruff format --check .
    - ruff check .
  import_linter:
    purpose: authoritative high-level architecture contracts
    required_command: lint-imports
    expected_contract_types:
    - layers
    - forbidden
    - protected
    - independence
    - acyclic siblings
  tach:
    purpose: module dependencies, public interfaces, layers and cycle enforcement
    required_command: tach check
    enable_when_stable:
    - forbid_circular_dependencies = true
  policy: Agents must not weaken or ignore gates without explicit human approval.
knowledge_continuity:
  context_file: CONTEXT.md
  adr_directory: docs/adr/
  slice_review_directory: docs/slice-reviews/
  policy: Vocabulary goes to CONTEXT.md; durable architectural choices go to ADRs;
    ordinary evidence and revisions go to slice reviews.
architecture_observability:
  source_tools:
  - tach
  - import-linter
  - python module metadata
  artifacts:
  - ArchitectureSnapshot
  - ArchitectureDelta
  rendering_policy: visuals are projections of typed architecture IR and become stale
    when source snapshots change
  archify: optional later renderer/validator evaluation; not a mandatory dependency
interaction_model:
  current_state: SQLite relational tables
  event_history: append-only Event table
  full_event_sourcing: false
  decision_states:
  - pending
  - answered
  - deferred
  - reopened
  - superseded
  supports_staging: true
  supports_per_object_discussion: true
  activation_boundary: VS1 foundation only; VS2 rich staged interaction
design_review_skill:
  name: software-design-clarity
  distribution: independent project-agnostic skill
  required_modes:
    design:
    - new architectural boundary
    - material API/module abstraction
    review:
    - before completing material structural changes
    - during slice review when architecture changed
    refactoring:
    - when complexity reduction is the primary objective
  relationship_to_tools:
    ruff: code conventions
    import_linter_and_tach: architecture/dependency enforcement
    software_design_clarity: abstraction and design quality
microsoft_agent_framework:
  role: default orchestration/runtime substrate from VS1 onward
  evaluation_goal: collect longitudinal evidence to judge suitability for this and
    future projects
  architecture_policy: MAF remains behind project-owned WorkflowRunner and AgentRuntime
    interfaces; no domain leakage
  observations_start: VS1
  removal_policy: remove only after repeated, material, unresolved friction remains
    after reasonable mitigation; removal requires ADR
  questions_at_end:
  - Was MAF suitable for this project?
  - Is MAF a good default for other agentic software projects?
model_usage_telemetry:
  live_store: SQLite
  analytics_store: Parquet + DuckDB
  capture_from: VS1
  fields:
  - policy_version
  - task_class
  - provider
  - model
  - route_reason
  - input_tokens
  - cached_input_tokens
  - output_tokens
  - reasoning_tokens
  - queue_ms
  - time_to_first_token_ms
  - generation_ms
  - total_turnaround_ms
  - price_catalog_version
  - estimated_total_cost
  - provider_reported_cost
  - outcome
  local_cost_policy: zero API spend; do not estimate electricity/hardware amortisation
  live_summary: Model Â· input/output tokens Â· estimated spend/local Â· elapsed
  detail_on_demand: true
routing_subsystem:
  design: 10_MODEL_ROUTING_SUBSYSTEM_DESIGN.md
  implementation_scope_vs1: core abstractions/versioning/provenance; rich switching
    UI deferred until multiple policies configured
double_entry_review:
  skill: double-entry-review-core-0.3.0-alpha.2
  method_revision: 7
  unit: one pair per material PR/change inside a slice
  pre_1_0_policy: mandatory for material/critical; routine ordinary workflow; borderline
    encouraged/default-to-yes with host waiver rationale
  materiality:
    hard_trigger: DER required
    two_or_more_strong_indicators: DER default required
    reassess_on_scope_change: true
  parallel_agents: separate worktrees/contributor branches; one history integrator
    owns canonical pair
  evidence_store: outside application worktrees; harness indexes references only
